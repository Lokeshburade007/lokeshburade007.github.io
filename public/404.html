<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lokesh Burade — Portfolio</title>
    <meta name="robots" content="noindex" />
    <!--
      Single-Page Apps for GitHub Pages
      https://github.com/rafgraph/spa-github-pages — MIT License

      GitHub Pages serves this file for any unknown path. We encode the
      requested path into a "?/..." query string and redirect to the site
      root. The matching decoder script in index.html restores the original
      URL via history.replaceState so BrowserRouter can match it.
    -->
    <script type="text/javascript">
      // For user/org sites (username.github.io served from the root domain),
      // pathSegmentsToKeep is 0. For project pages (username.github.io/repo),
      // set this to 1.
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
