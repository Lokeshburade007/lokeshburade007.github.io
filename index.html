    <!--
      Single-Page Apps for GitHub Pages decoder — paired with public/404.html.
      Restores the real path from the redirect query string before React boots,
      so deep links like /about and hard refreshes don't 404.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
